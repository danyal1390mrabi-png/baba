<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مدل‌های سه‌بعدی نمونه کارها | نرده و پله گرد | محمد صادق مرادی</title>
<meta name="theme-color" content="#060607">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a341;--gl:#e9cf82;--iv:#f4f0e6;--gray:#8d8d92;--ease:cubic-bezier(.22,1,.36,1)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#060607;color:var(--iv);font-family:'Vazirmatn',sans-serif}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;color:inherit}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 55%,rgba(201,163,65,.14),transparent 70%),#060607}
.stage{position:fixed;inset:0;perspective:1300px;touch-action:none;cursor:grab;overflow:hidden}
.stage:active{cursor:grabbing}
.obj{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.t{position:absolute;left:-65px;top:-80px;width:130px;height:160px;backface-visibility:hidden;transition:transform 1.1s var(--ease)}
.c{width:100%;height:100%;padding:4px;background:linear-gradient(135deg,#f3dc92,#a47f26 40%,#e0bd57 70%,#8a6819);box-shadow:0 12px 30px -8px rgba(0,0,0,.9);transition:transform .3s var(--ease),box-shadow .3s}
.c img{width:100%;height:100%;object-fit:cover;display:block;background:#111;opacity:0;transition:opacity .6s;pointer-events:none;-webkit-user-drag:none}
.c img.ld{opacity:1}
.t:hover .c{transform:scale(1.14);box-shadow:0 0 40px rgba(233,207,130,.5)}
.top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 28px;pointer-events:none;background:linear-gradient(180deg,rgba(6,6,7,.85),transparent)}
.top>*{pointer-events:auto}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:8px 16px;border:1px solid rgba(244,240,230,.14);border-radius:30px;background:rgba(11,11,12,.6);backdrop-filter:blur(6px);transition:.3s var(--ease)}
.pill:hover,.pill.on{border-color:var(--gold);color:var(--gl)}
.pill.on{background:rgba(201,163,65,.16)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.bot{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:center;gap:12px;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));pointer-events:none;background:linear-gradient(0deg,rgba(6,6,7,.85),transparent)}
.bot>*{pointer-events:auto}
.hint{font-size:12.5px;color:var(--gray)}
@media(max-width:700px){.tabs{order:3;width:100%}.hint{font-size:11.5px}}
.lb{position:fixed;inset:0;z-index:50;background:rgba(5,5,6,.95);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;opacity:0;visibility:hidden;transition:opacity .4s var(--ease),visibility 0s linear .4s}
.lb.open{opacity:1;visibility:visible;transition:opacity .4s var(--ease)}
.lb img{max-width:min(90vw,880px);max-height:72vh;padding:10px;background:linear-gradient(135deg,#f3dc92,#a47f26 40%,#e0bd57 70%,#8a6819);box-shadow:0 50px 90px -20px #000,0 0 100px -20px rgba(233,207,130,.35)}
.lb-cap{margin-top:22px;font-size:14px;color:var(--gray)}.lb-cap b{color:var(--gl);font-weight:600}
.lb-b{position:absolute;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.08);font-size:22px;display:flex;align-items:center;justify-content:center;transition:.3s}
.lb-b:hover{background:var(--gold);color:#0b0b0c}
.lb-x{top:calc(18px + env(safe-area-inset-top,0px));left:18px}.lb-p{top:50%;right:18px;margin-top:-22px}.lb-n{top:50%;left:18px;margin-top:-22px}
@media(max-width:700px){.lb-p,.lb-n{top:auto;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin:0}.lb-p{right:calc(50% - 54px)}.lb-n{left:calc(50% - 54px)}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="stage" id="st" dir="ltr"><div class="obj" id="obj"></div></div>

<div class="top">
  <a class="pill" href="index.html">→ صفحه اصلی</a>
  <div class="tabs">
    <button class="pill" data-m="helix">پله مارپیچ</button>
    <button class="pill" data-m="sphere">کره</button>
    <button class="pill" data-m="ring">استوانه</button>
    <a class="pill" href="gallery.html">راهرو ←</a>
  </div>
</div>
<div class="bot"><span class="hint" id="hint"></span><button class="pill on" id="auto">چرخش خودکار</button></div>

<div class="lb" id="lb">
  <button class="lb-b lb-x" id="lx" aria-label="بستن">✕</button>
  <button class="lb-b lb-p" id="lp" aria-label="قبلی">›</button>
  <button class="lb-b lb-n" id="ln" aria-label="بعدی">‹</button>
  <img id="li" alt="نمونه کار نرده و پله گرد">
  <div class="lb-cap" id="lc"></div>
</div>

<script>
const FILES = ["1001025361_4539140.webp", "1769063547259.webp", "1769063547898.webp", "1769063547945.webp", "1769063548287.webp", "1769063548410.webp", "1769063548459.webp", "1769063548609.webp", "1769063548635.webp", "1769063549677.webp", "1769063549983.webp", "1769063550005.webp", "1769063550147.webp", "1769063550196.webp", "1769063550267.webp", "1769063550422.webp", "1769063550565.webp", "1769063550666.webp", "1769063551599.webp", "1769063551646.webp", "1769063551739.webp", "1769063552385.webp", "1769063554684.webp", "1769063939640.webp", "1769063992913.webp", "1769064010104.webp", "1769064010181.webp", "1769064010213.webp", "1769064010268.webp", "1769064010354.webp", "1769064010383.webp", "1769064010393.webp", "1769064010433.webp", "1769064010488.webp", "1769064010696.webp", "IMG_20230710_135007.webp", "IMG_20230816_141102.webp", "IMG_20230816_155301.webp", "IMG_20231114_163233.webp", "IMG_20240129_120745.webp", "IMG_20240219_151440.webp", "IMG_20240321_143407.webp", "IMG_20240418_105042.webp", "IMG_20240429_123205.webp", "IMG_20240525_172044.webp", "IMG_20240605_213019.webp", "IMG_20240619_151328.webp", "IMG_20240619_151336.webp", "IMG_20241208_101142.webp", "IMG_20241224_145604.webp", "IMG_20250209_174859.webp", "IMG_20250209_174904.webp", "IMG_20250228_153021.webp", "IMG_20250907_194751.webp", "IMG_20250907_194759.webp", "IMG_20250907_194922.webp", "IMG_20250908_125411.webp", "IMG_20251025_162017.webp", "IMG_20251025_162118.webp", "IMG_20251025_162121.webp", "IMG_20251101_142727.webp", "IMG_20251203_144954.webp", "IMG_20251203_145004.webp", "IMG_۲۰۲۳۰۴۰۸_۱۷۲۶۱۲.webp", "IMG_۲۰۲۳۰۴۰۸_۱۷۲۸۰۹.webp", "IMG_۲۰۲۳۰۵۱۸_۱۰۳۷۱۲.webp", "IMG_۲۰۲۳۰۶۱۸_۱۳۲۰۰۳.webp", "photo_2026-07-18_17-36-20.webp", "photo_2026-07-18_17-37-48.webp", "photo_2026-07-18_17-38-02.webp", "photo_2026-07-18_17-38-08.webp", "photo_2026-07-18_17-38-20.webp", "photo_2026-07-18_17-39-01.webp", "photo_2026-07-18_17-39-10.webp", "photo_2026-07-18_17-39-40.webp", "photo_2026-07-18_17-39-44.webp", "photo_2026-07-18_17-39-57.webp", "photo_2026-07-18_17-40-02.webp"];
const N=FILES.length,fa=n=>Number(n).toLocaleString('fa-IR');
const st=document.getElementById('st'),obj=document.getElementById('obj'),hint=document.getElementById('hint');

/* tiles */
const tiles=FILES.map((f,i)=>{
  const t=document.createElement('div');t.className='t';t.dataset.i=i;
  t.innerHTML=`<div class="c"><img alt="نمونه کار شماره ${fa(i+1)}" decoding="async" src="images/${encodeURIComponent(f)}"></div>`;
  const im=t.firstChild.firstChild;im.onload=()=>im.classList.add('ld');im.onerror=()=>{t.style.display='none'};
  obj.appendChild(t);return t;
});

/* layouts */
const DA=24,DY=22,PER=16,GA=Math.PI*(3-Math.sqrt(5));
const modes={
  helix:{R:380,rx:-12,hint:'بکشید یا اسکرول کنید تا از پله مارپیچ بالا بروید',
    lay:i=>`translateY(${-i*DY}px) rotateY(${i*DA}deg) translateZ(380px)`},
  sphere:{R:440,rx:-10,hint:'برای چرخاندن کره در همه جهت‌ها بکشید',
    lay:i=>{const y=1-2*(i+.5)/N,p=Math.asin(y)*180/Math.PI,th=i*GA*180/Math.PI;return `rotateY(${th}deg) rotateX(${p}deg) translateZ(440px)`}},
  ring:{R:350,rx:-10,hint:'بکشید تا استوانه نمونه کارها بچرخد',
    lay:i=>{const r=Math.floor(i/PER),c=i%PER,rows=Math.ceil(N/PER),a=c*360/PER+(r%2)*180/PER,y=(r-(rows-1)/2)*174;return `translateY(${y}px) rotateY(${a}deg) translateZ(350px)`}}
};

let m='helix',rx=-12,ry=0,ty=0,vx=0,sc=1,auto=!matchMedia('(prefers-reduced-motion: reduce)').matches,dirn=-1;
let drag=false,lx=0,ly=0,moved=0,lbOpen=false;

function fit(){
  const M=modes[m],w=innerWidth,h=innerHeight;
  sc=m==='helix'?Math.min(1,w/700)
    :m==='ring'?Math.min(1.1,w/(2*M.R+300),(h-150)/890)
    :Math.min(1.1,w/(2*M.R+240),(h-150)/(2*M.R+60));
  sc=Math.max(sc,.36);
}
function apply(){
  obj.style.transform=`scale(${sc}) translateZ(${-modes[m].R*.8}px) rotateX(${rx}deg) translateY(${ty}px) rotateY(${ry}deg)`;
}
function setMode(k){
  m=k;const M=modes[k];rx=M.rx;ry=0;ty=0;vx=0;dirn=-1;
  tiles.forEach((t,i)=>{t.style.transform=M.lay(i)});
  fit();hint.textContent=M.hint;
  document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===k));
  history.replaceState(null,'','#'+k);
}
document.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.m)));
const autoBtn=document.getElementById('auto');
autoBtn.classList.toggle('on',auto);
autoBtn.addEventListener('click',()=>{auto=!auto;autoBtn.classList.toggle('on',auto)});

/* loop */
function tick(){
  if(!drag&&!lbOpen){
    if(Math.abs(vx)>.02){ry+=vx;vx*=.94}
    else if(auto)ry+=m==='helix'?.18*dirn:.2;
  }
  if(m==='helix'){
    const lim=-(N-1)*DA;
    if(ry<=lim){ry=lim;dirn=1}
    if(ry>=0){ry=0;dirn=-1}
    ty=-ry*DY/DA;
  }
  apply();requestAnimationFrame(tick);
}

/* interaction */
st.addEventListener('pointerdown',e=>{drag=true;moved=0;lx=e.clientX;ly=e.clientY;vx=0});
addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  ry+=dx*.4;vx=dx*.4;
  rx=m==='sphere'?Math.max(-80,Math.min(80,rx-dy*.4)):Math.max(-35,Math.min(10,rx-dy*.2));
});
addEventListener('pointerup',()=>{drag=false});
addEventListener('pointercancel',()=>{drag=false});
st.addEventListener('wheel',e=>{e.preventDefault();ry-=e.deltaY*.15},{passive:false});
obj.addEventListener('click',e=>{
  if(moved>6)return;
  const t=e.target.closest('.t');if(t)openLb(+t.dataset.i);
});
addEventListener('resize',fit);

/* viewer */
const lb=document.getElementById('lb'),li=document.getElementById('li'),lc=document.getElementById('lc');
let cur=0;
function show(){li.src='images/'+encodeURIComponent(FILES[cur]);lc.innerHTML=`<b>پروژه ${fa(cur+1)}</b> · ${fa(cur+1)} از ${fa(N)}`}
function openLb(i){cur=i;lbOpen=true;show();lb.classList.add('open')}
function closeLb(){lbOpen=false;lb.classList.remove('open')}
const step=d=>{cur=(cur+d+N)%N;show()};
document.getElementById('lx').onclick=closeLb;
document.getElementById('lp').onclick=()=>step(-1);
document.getElementById('ln').onclick=()=>step(1);
lb.addEventListener('click',e=>{if(e.target===lb)closeLb()});
addEventListener('keydown',e=>{
  if(!lbOpen)return;
  if(e.key==='Escape')closeLb();
  if(e.key==='ArrowLeft')step(1);
  if(e.key==='ArrowRight')step(-1);
});
let sx=0;
lb.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX},{passive:true});
lb.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)step(d<0?1:-1)},{passive:true});

const h=location.hash.slice(1);
setMode(modes[h]?h:'helix');
requestAnimationFrame(tick);
</script>
</body>
</html>
