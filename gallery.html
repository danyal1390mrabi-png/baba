<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>گالری سه‌بعدی پروژه‌ها | نرده و پله گرد | محمد صادق مرادی</title>
<meta name="description" content="بازدید مجازی و سه‌بعدی از نمونه کارهای اجرا شده نرده و پله گرد؛ مثل یک بازدید حضوری از نزدیک ببینید.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#0b0b0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0c; --gold:#c9a341; --gold-light:#e9cf82; --ivory:#f4f0e6; --gray:#8d8d92;
  --line:rgba(244,240,230,.1); --ease:cubic-bezier(.22,1,.36,1);
  --P:900px; --halfW:340px; --fw:260px; --fh:340px; --S:260px;
  --floorY:260px; --ceilY:-300px;
  --wallW:calc(var(--S) + 2px);
  --wallH:calc(var(--floorY) - var(--ceilY));
  --cy:calc((var(--floorY) + var(--ceilY)) / 2);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:#070708;}
body{color:var(--ivory);font-family:'Vazirmatn',sans-serif;font-weight:300;line-height:1.8;overflow-x:hidden;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}

/* scroll driver */
.spacer{width:1px;height:6000px;}

/* ---------- 3D scene ---------- */
.viewport{position:fixed;inset:0;perspective:var(--P);perspective-origin:50% 50%;overflow:hidden;background:#060607;}
.world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;will-change:transform;}
.slot{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;}

.wall{
  position:absolute;left:0;top:0;width:var(--wallW);height:var(--wallH);
  margin-left:calc(var(--wallW) / -2);margin-top:calc(var(--wallH) / -2);
  background:
    linear-gradient(180deg,rgba(0,0,0,.55) 0%,transparent 28%,transparent 70%,rgba(0,0,0,.6) 100%),
    linear-gradient(180deg,#17171a 0%,#1d1d21 55%,#141416 100%);
  border-left:1px solid rgba(255,255,255,.035);
}
.wall::after{ /* baseboard */
  content:"";position:absolute;left:0;right:0;bottom:0;height:7%;
  background:linear-gradient(180deg,#0d0d0f,#08080a);border-top:1px solid rgba(201,163,65,.35);
}
.wall.lit{
  background:
    radial-gradient(ellipse 62% 58% at 50% 46%,rgba(255,232,170,.20),rgba(255,232,170,.05) 55%,transparent 75%),
    linear-gradient(180deg,rgba(0,0,0,.5) 0%,transparent 26%,transparent 70%,rgba(0,0,0,.6) 100%),
    linear-gradient(180deg,#1b1b1f 0%,#212126 55%,#16161a 100%);
}
.wall.l{transform:translate3d(calc(var(--halfW) * -1),var(--cy),0) rotateY(90deg);}
.wall.r{transform:translate3d(var(--halfW),var(--cy),0) rotateY(-90deg);}

.floor,.ceil{
  position:absolute;left:0;top:0;width:calc(var(--halfW) * 2 + 2px);height:var(--wallW);
  margin-left:calc(var(--halfW) * -1 - 1px);margin-top:calc(var(--wallW) / -2);
}
.floor{
  background:
    linear-gradient(90deg,transparent 31%,rgba(201,163,65,.22) 31.2%,transparent 31.9%,transparent 68.1%,rgba(201,163,65,.22) 68.8%,transparent 69%),
    linear-gradient(90deg,#0b0b0d 0%,#141417 26%,#1a1a1e 50%,#141417 74%,#0b0b0d 100%);
  border-top:1px solid rgba(255,255,255,.045);
  transform:translate3d(0,var(--floorY),0) rotateX(90deg);
}
.floor.lit-l{background:
    radial-gradient(ellipse 34% 40% at 14% 50%,rgba(255,226,150,.20),transparent 100%),
    linear-gradient(90deg,transparent 31%,rgba(201,163,65,.22) 31.2%,transparent 31.9%,transparent 68.1%,rgba(201,163,65,.22) 68.8%,transparent 69%),
    linear-gradient(90deg,#0b0b0d 0%,#141417 26%,#1a1a1e 50%,#141417 74%,#0b0b0d 100%);}
.floor.lit-r{background:
    radial-gradient(ellipse 34% 40% at 86% 50%,rgba(255,226,150,.20),transparent 100%),
    linear-gradient(90deg,transparent 31%,rgba(201,163,65,.22) 31.2%,transparent 31.9%,transparent 68.1%,rgba(201,163,65,.22) 68.8%,transparent 69%),
    linear-gradient(90deg,#0b0b0d 0%,#141417 26%,#1a1a1e 50%,#141417 74%,#0b0b0d 100%);}
.ceil{
  background:radial-gradient(ellipse 70% 60% at 50% 50%,rgba(255,236,190,.22),transparent 100%),#0d0d0f;
  transform:translate3d(0,var(--ceilY),0) rotateX(-90deg);
}
.ceil::after{ /* light fixture */
  content:"";position:absolute;left:24%;right:24%;top:calc(50% - 5px);height:10px;border-radius:6px;
  background:#fff4d6;box-shadow:0 0 30px 10px rgba(255,236,190,.55),0 0 90px 30px rgba(255,226,150,.25);
}

/* frames (hung on the wall) */
.frame{
  position:absolute;left:0;top:0;width:var(--fw);height:calc(var(--fh) * var(--hv,1));
  margin-left:calc(var(--fw) / -2);margin-top:calc(var(--fh) * var(--hv,1) / -2);
  transform-style:preserve-3d;
}
.frame.r{transform:translate3d(calc(var(--halfW) - 1px),0,0) rotateY(-90deg);}
.frame.l{transform:translate3d(calc(var(--halfW) * -1 + 1px),0,0) rotateY(90deg);}
.cone{
  position:absolute;left:-6%;right:-6%;bottom:100%;height:130px;pointer-events:none;
  background:linear-gradient(0deg,rgba(255,236,190,.20),transparent);
  clip-path:polygon(32% 0,68% 0,100% 100%,0 100%);
}
.fr{
  position:absolute;inset:0;padding:9px;cursor:pointer;
  background:linear-gradient(135deg,#f3dc92 0%,#a47f26 38%,#e0bd57 66%,#8a6819 100%);
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 34px 60px -12px rgba(0,0,0,.95),0 0 90px -20px rgba(233,207,130,.20);
  transform:translateZ(0);
  transition:transform .55s var(--ease),box-shadow .55s var(--ease);
}
.fr:hover{
  transform:translateZ(34px);
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 50px 80px -14px rgba(0,0,0,.95),0 0 120px -10px rgba(233,207,130,.45);
}
.mat{position:absolute;inset:9px;background:#efe9da;padding:7%;box-shadow:inset 0 0 18px rgba(0,0,0,.28);}
.ph{position:relative;width:100%;height:100%;overflow:hidden;background:#0d0d0e;box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.25);}
.ph img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .8s var(--ease);}
.ph img.ld{opacity:1;}
.ph::after{ /* glass reflection */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.04) 28%,transparent 42%);
}
.plq{
  position:absolute;left:50%;top:calc(100% + 18px);transform:translateX(-50%);white-space:nowrap;
  padding:2px 14px;font-size:12px;font-weight:700;color:#1b1406;border-radius:2px;
  background:linear-gradient(180deg,#e6c564,#9c7a22);box-shadow:0 6px 14px -4px rgba(0,0,0,.8);
}

/* end wall */
.endwall{
  position:absolute;left:0;top:0;width:calc(var(--halfW) * 2);height:var(--wallH);
  margin-left:calc(var(--halfW) * -1);margin-top:calc(var(--wallH) / -2);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
  background:radial-gradient(ellipse 60% 55% at 50% 50%,rgba(255,226,150,.16),transparent 80%),linear-gradient(180deg,#141416,#0d0d0f);
}
.end-in h2{font-size:clamp(20px,3.2vw,34px);font-weight:800;line-height:1.5;margin:8px 0 10px;}
.end-in p{color:var(--gray);font-size:14px;max-width:420px;margin:0 auto 22px;}
.eyebrow{color:var(--gold);font-size:12px;letter-spacing:.08em;font-weight:600;}
.btn{display:inline-block;padding:13px 28px;margin:5px;border-radius:2px;font-weight:700;font-size:14px;background:var(--gold);color:#0b0b0c;transition:.3s var(--ease);}
.btn:hover{background:var(--gold-light);transform:translateY(-3px);}
.btn.ghost{background:transparent;color:var(--ivory);border:1px solid rgba(244,240,230,.35);}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold-light);}

/* atmosphere */
.fog{
  position:fixed;inset:-40%;pointer-events:none;z-index:5;will-change:transform;
  background:radial-gradient(ellipse 15% 20% at 50% 50%,rgba(6,6,7,.96) 0%,rgba(6,6,7,.7) 55%,transparent 100%);
}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%);}

/* HUD */
.hud{position:fixed;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:16px 22px;pointer-events:none;}
.hud > *{pointer-events:auto;}
.hud.top{top:0;background:linear-gradient(180deg,rgba(6,6,7,.85),transparent);padding-top:calc(16px + env(safe-area-inset-top,0px));}
.back{font-size:14px;font-weight:600;padding:8px 16px;border:1px solid var(--line);border-radius:30px;background:rgba(11,11,12,.55);backdrop-filter:blur(6px);transition:.3s var(--ease);}
.back:hover{border-color:var(--gold);color:var(--gold-light);}
.hud-title{font-weight:700;font-size:15px;letter-spacing:.02em;}
.hud-title span{color:var(--gold);}
.counter{font-size:14px;font-weight:600;padding:8px 16px;border:1px solid var(--line);border-radius:30px;background:rgba(11,11,12,.55);backdrop-filter:blur(6px);min-width:86px;text-align:center;}
.counter b{color:var(--gold-light);}
.hud.bottom{bottom:0;flex-direction:column;gap:10px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,rgba(6,6,7,.85),transparent);}
.hint{font-size:12.5px;color:var(--gray);transition:opacity .6s;display:flex;align-items:center;gap:8px;}
.hint i{display:inline-block;width:14px;height:22px;border:1.5px solid var(--gray);border-radius:8px;position:relative;}
.hint i::after{content:"";position:absolute;left:50%;top:4px;width:2px;height:5px;margin-left:-1px;background:var(--gold);border-radius:2px;animation:wheel 1.4s infinite;}
@keyframes wheel{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(8px)}}
.hint.hide{opacity:0;}
.prog{width:min(340px,60vw);height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;}
.prog div{height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));transform-origin:right center;transform:scaleX(0);}

/* intro */
.intro{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
  background:radial-gradient(ellipse at center,rgba(8,8,9,.62),rgba(6,6,7,.93));backdrop-filter:blur(7px);
  transition:opacity 1s var(--ease),visibility 0s linear 1s;
}
.intro.hide{opacity:0;visibility:hidden;pointer-events:none;}
.intro h1{font-size:clamp(28px,5vw,52px);font-weight:800;line-height:1.4;margin:8px 0 12px;}
.intro h1 span{color:var(--gold-light);}
.intro p{color:var(--gray);max-width:460px;margin:0 auto 30px;font-size:15px;}
.intro .btn{font-size:15px;padding:15px 38px;border:0;cursor:pointer;}

/* inspect viewer */
.lb{
  position:fixed;inset:0;z-index:200;background:rgba(5,5,6,.94);backdrop-filter:blur(8px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
  opacity:0;visibility:hidden;transition:opacity .4s var(--ease),visibility 0s linear .4s;
}
.lb.open{opacity:1;visibility:visible;transition:opacity .4s var(--ease),visibility 0s linear 0s;}
.lb-stage{perspective:1300px;width:100%;display:flex;justify-content:center;}
.lb-card{
  position:relative;padding:12px;transform-style:preserve-3d;transition:transform .25s var(--ease);
  background:linear-gradient(135deg,#f3dc92,#a47f26 40%,#e0bd57 68%,#8a6819);
  box-shadow:0 60px 100px -20px rgba(0,0,0,.95),0 0 120px -20px rgba(233,207,130,.35);
  transform:scale(.92) rotateX(8deg);opacity:0;
}
.lb.open .lb-card{opacity:1;transition:transform .6s var(--ease),opacity .6s var(--ease);}
.lb-mat{background:#efe9da;padding:3.2%;}
.lb-card img{display:block;max-width:min(88vw,860px);max-height:70vh;width:auto;height:auto;box-shadow:0 0 0 1px rgba(0,0,0,.4);}
.lb-glare{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:.9;}
.lb-cap{margin-top:26px;font-size:14px;color:var(--gray);}
.lb-cap b{color:var(--gold-light);font-weight:600;}
.lb-btn{
  position:absolute;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.07);color:var(--ivory);
  border:0;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.3s var(--ease);
}
.lb-btn:hover{background:var(--gold);color:#0b0b0c;}
.lb-close{top:calc(20px + env(safe-area-inset-top,0px));left:20px;}
.lb-prev{top:50%;right:20px;margin-top:-23px;}
.lb-next{top:50%;left:20px;margin-top:-23px;}
@media(max-width:700px){
  .hud-title{display:none;}
  .hud{padding-left:14px;padding-right:14px;}
  .lb-btn{width:40px;height:40px;font-size:20px;}
  .lb-prev,.lb-next{top:auto;bottom:calc(22px + env(safe-area-inset-bottom,0px));margin-top:0;}
  .lb-prev{right:calc(50% - 56px);}
  .lb-next{left:calc(50% - 56px);}
}
@media(prefers-reduced-motion:reduce){.hint i::after{animation:none;}}
</style>
</head>
<body>

<div class="hud top">
  <a class="back" href="index.html">→ صفحه اصلی</a>
  <div class="hud-title">گالری <span>سه‌بعدی</span> پروژه‌ها</div>
  <div class="counter"><b id="cur">۱</b> / <span id="tot">۰</span></div>
</div>

<div class="viewport" id="viewport"><div class="world" id="world"></div></div>
<div class="fog" id="fog"></div>
<div class="vignette"></div>

<div class="hud bottom">
  <div class="hint" id="hint"><i></i><span id="hintTxt">برای قدم زدن در گالری اسکرول کنید</span></div>
  <div class="prog"><div id="prog"></div></div>
</div>

<div class="intro" id="intro">
  <div>
    <div class="eyebrow">بازدید مجازی از نمونه کارها</div>
    <h1>گالری <span>پروژه‌های اجرا شده</span></h1>
    <p>در راهروی گالری قدم بزنید، به نمونه کارها نگاه کنید و روی هر قاب بزنید تا از نزدیک و در ابعاد بزرگ ببینید.</p>
    <button class="btn" id="enter">ورود به گالری</button>
  </div>
</div>

<div class="lb" id="lb">
  <button class="lb-btn lb-close" id="lbClose" aria-label="بستن">✕</button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="قبلی">›</button>
  <button class="lb-btn lb-next" id="lbNext" aria-label="بعدی">‹</button>
  <div class="lb-stage" id="lbStage">
    <div class="lb-card" id="lbCard"><div class="lb-mat"><img id="lbImg" src="" alt="نمونه کار نرده و پله گرد"></div><div class="lb-glare" id="lbGlare"></div></div>
  </div>
  <div class="lb-cap" id="lbCap"></div>
</div>

<div class="spacer" id="spacer"></div>

<script>
const FILES = ["1001025361_4539140.webp", "1769063547259.webp", "1769063547898.webp", "1769063547945.webp", "1769063548287.webp", "1769063548410.webp", "1769063548459.webp", "1769063548609.webp", "1769063548635.webp", "1769063549677.webp", "1769063549983.webp", "1769063550005.webp", "1769063550147.webp", "1769063550196.webp", "1769063550267.webp", "1769063550422.webp", "1769063550565.webp", "1769063550666.webp", "1769063551599.webp", "1769063551646.webp", "1769063551739.webp", "1769063552385.webp", "1769063554684.webp", "1769063939640.webp", "1769063992913.webp", "1769064010104.webp", "1769064010181.webp", "1769064010213.webp", "1769064010268.webp", "1769064010354.webp", "1769064010383.webp", "1769064010393.webp", "1769064010433.webp", "1769064010488.webp", "1769064010696.webp", "IMG_20230710_135007.webp", "IMG_20230816_141102.webp", "IMG_20230816_155301.webp", "IMG_20231114_163233.webp", "IMG_20240129_120745.webp", "IMG_20240219_151440.webp", "IMG_20240321_143407.webp", "IMG_20240418_105042.webp", "IMG_20240429_123205.webp", "IMG_20240525_172044.webp", "IMG_20240605_213019.webp", "IMG_20240619_151328.webp", "IMG_20240619_151336.webp", "IMG_20241208_101142.webp", "IMG_20241224_145604.webp", "IMG_20250209_174859.webp", "IMG_20250209_174904.webp", "IMG_20250228_153021.webp", "IMG_20250907_194751.webp", "IMG_20250907_194759.webp", "IMG_20250907_194922.webp", "IMG_20250908_125411.webp", "IMG_20251025_162017.webp", "IMG_20251025_162118.webp", "IMG_20251025_162121.webp", "IMG_20251101_142727.webp", "IMG_20251203_144954.webp", "IMG_20251203_145004.webp", "IMG_۲۰۲۳۰۴۰۸_۱۷۲۶۱۲.webp", "IMG_۲۰۲۳۰۴۰۸_۱۷۲۸۰۹.webp", "IMG_۲۰۲۳۰۵۱۸_۱۰۳۷۱۲.webp", "IMG_۲۰۲۳۰۶۱۸_۱۳۲۰۰۳.webp", "photo_2026-07-18_17-36-20.webp", "photo_2026-07-18_17-37-48.webp", "photo_2026-07-18_17-38-02.webp", "photo_2026-07-18_17-38-08.webp", "photo_2026-07-18_17-38-20.webp", "photo_2026-07-18_17-39-01.webp", "photo_2026-07-18_17-39-10.webp", "photo_2026-07-18_17-39-40.webp", "photo_2026-07-18_17-39-44.webp", "photo_2026-07-18_17-39-57.webp", "photo_2026-07-18_17-40-02.webp"];
const N = FILES.length;
const fa = n => Number(n).toLocaleString('fa-IR');
const clamp = (v,a,b) => Math.min(b,Math.max(a,v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isTouch = matchMedia('(hover: none)').matches;

const root = document.documentElement;
const world = document.getElementById('world');
const spacer = document.getElementById('spacer');
const fog = document.getElementById('fog');
const curEl = document.getElementById('cur');
const progEl = document.getElementById('prog');
const hint = document.getElementById('hint');
document.getElementById('tot').textContent = fa(N);
if (isTouch) document.getElementById('hintTxt').textContent = 'برای قدم زدن در گالری انگشت را بکشید';

/* ---------- metrics ---------- */
let vw, vh, P, halfW, fw, fh, S, floorY, ceilY, camMax, endZ, amp, lead;
const FIRST = 1.2;           // first frame distance in slots
const ENTRY = 3;             // empty entrance slots
const TAIL = 2;              // empty slots before end wall
const slotZ = k => -(k * S) - FIRST * S;

function metrics(){
  vw = innerWidth; vh = innerHeight;
  const small = vw < 700;
  P = small ? 620 : 900;
  halfW = clamp(vw * (small ? 0.40 : 0.30), 150, 400);
  fw = small ? 150 : clamp(vw * 0.20, 190, 290);
  fh = fw * 1.3;
  S = fw * 1.02;
  floorY = fh * 0.78;
  ceilY = -fh * 0.9;
  amp = small ? 13 : 17;
  lead = halfW * 1.05;
  endZ = slotZ(N + TAIL) - S / 2;
  camMax = -endZ - (small ? 520 : 760);
  const st = root.style;
  st.setProperty('--P', P + 'px');
  st.setProperty('--halfW', halfW + 'px');
  st.setProperty('--fw', fw + 'px');
  st.setProperty('--fh', fh + 'px');
  st.setProperty('--S', S + 'px');
  st.setProperty('--floorY', floorY + 'px');
  st.setProperty('--ceilY', ceilY + 'px');
  spacer.style.height = Math.round(vh + camMax * 0.5) + 'px';
  slots.forEach(s => { s.el.style.transform = `translate3d(0,0,${s.z = slotZ(s.k)}px)`; });
  const e = document.getElementById('endwall');
  if (e) e.style.transform = `translate3d(0,var(--cy),${endZ}px)`;
}

/* ---------- build scene ---------- */
const slots = [];
const HV = [1, 0.9, 1.08];
for (let k = -ENTRY; k < N + TAIL; k++){
  const el = document.createElement('div');
  el.className = 'slot';
  const hasFrame = k >= 0 && k < N;
  const side = k % 2 === 0 ? 'r' : 'l';            // even → right wall, odd → left wall
  let html = '';
  html += `<div class="wall l${hasFrame && side==='l' ? ' lit':''}"></div>`;
  html += `<div class="wall r${hasFrame && side==='r' ? ' lit':''}"></div>`;
  html += `<div class="floor${hasFrame ? ' lit-'+side : ''}"></div><div class="ceil"></div>`;
  if (hasFrame){
    html += `<div class="frame ${side}" style="--hv:${HV[k % 3]}"><div class="cone"></div>
      <div class="fr" data-i="${k}"><div class="mat"><div class="ph"><img alt="نمونه کار شماره ${fa(k+1)}" decoding="async" data-src="images/${encodeURIComponent(FILES[k])}"></div></div></div>
      <div class="plq">پروژه ${fa(k+1)}</div></div>`;
  }
  el.innerHTML = html;
  el.style.display = 'none';
  world.appendChild(el);
  const imgs = el.querySelectorAll('img');
  imgs.forEach(img => {
    img.addEventListener('load', () => img.classList.add('ld'));
    img.addEventListener('error', () => { const f = img.closest('.frame'); if (f) f.style.display = 'none'; });
  });
  slots.push({ k, el, z: 0, vis: false, imgs, loaded: false });
}
const end = document.createElement('div');
end.className = 'endwall'; end.id = 'endwall';
end.innerHTML = `<div class="end-in"><div class="eyebrow">پایان بازدید</div>
  <h2>پروژه بعدی می‌تواند پروژه شما باشد</h2>
  <p>برای طراحی و اجرای نرده و پله گرد متناسب با فضای شما، مشاوره رایگان بگیرید.</p>
  <a class="btn" href="index.html#contact">درخواست مشاوره رایگان</a>
  <a class="btn ghost" href="index.html">بازگشت به صفحه اصلی</a></div>`;
world.appendChild(end);
metrics();

/* ---------- camera loop ---------- */
let cam = -ENTRY * S, yaw = 0, pitch = 0, tx = 0;
let mx = 0, my = 0, smx = 0, smy = 0;
let entered = false;
addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') return;
  mx = (e.clientX / innerWidth - .5) * 2; my = (e.clientY / innerHeight - .5) * 2;
});

function tick(){
  const maxScroll = Math.max(1, spacer.offsetHeight - vh);
  const prog = clamp(scrollY / maxScroll, 0, 1);
  const target = entered ? prog * camMax : -ENTRY * S;
  const k = reduce ? 1 : (entered ? 0.085 : 0.05);
  cam += (target - cam) * k;
  if (Math.abs(target - cam) < .05) cam = target;
  smx += (mx - smx) * .06; smy += (my - smy) * .06;

  // gaze: visitor turns toward the frame being passed (alternating right / left)
  const p = (cam + lead - FIRST * S) / S;
  const fadeIn = clamp(cam / (S * 1.5), 0, 1);
  const fadeOut = clamp((camMax - cam) / (S * 2.5), 0, 1);
  const f = fadeIn * fadeOut;
  const wave = Math.cos(Math.PI * p);
  yaw = wave * amp * f + (reduce ? 0 : smx * 5);
  pitch = reduce ? 0 : -smy * 3;
  tx = wave * halfW * .16 * f;
  const bob = reduce ? 0 : Math.sin(cam * .017) * 2.4;

  world.style.transform = `rotateX(${pitch}deg) rotateY(${yaw}deg) translate3d(${tx}px,${bob}px,${cam}px)`;
  fog.style.transform = `translateX(${-P * Math.tan(yaw * Math.PI / 180)}px)`;

  // cull + lazy load
  for (const s of slots){
    const zp = s.z + cam;
    const vis = zp > -4800 && zp < 520;
    if (vis !== s.vis){ s.el.style.display = vis ? '' : 'none'; s.vis = vis; }
    if (vis && !s.loaded && zp > -3800){
      s.loaded = true;
      s.imgs.forEach(img => { if (img.dataset.src) img.src = img.dataset.src; });
    }
  }

  const j = clamp(Math.round(p), 0, N - 1);
  const txt = fa(j + 1);
  if (curEl.textContent !== txt) curEl.textContent = txt;
  progEl.style.transform = `scaleX(${prog})`;
  hint.classList.toggle('hide', scrollY > 60);
  requestAnimationFrame(tick);
}

/* ---------- intro ---------- */
const intro = document.getElementById('intro');
function enter(){
  if (entered) return;
  entered = true; intro.classList.add('hide');
  root.style.overflow = '';
}
if (scrollY > 80){ entered = true; intro.classList.add('hide'); }
else { root.style.overflow = 'hidden'; }
document.getElementById('enter').addEventListener('click', enter);
addEventListener('keydown', e => { if (!entered && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); enter(); } });

/* ---------- inspect viewer ---------- */
const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'),
      lbCard = document.getElementById('lbCard'), lbCap = document.getElementById('lbCap'),
      lbGlare = document.getElementById('lbGlare'), lbStage = document.getElementById('lbStage');
let cur = 0, lbOpen = false;
function showLb(){
  lbImg.src = 'images/' + encodeURIComponent(FILES[cur]);
  lbCap.innerHTML = `<b>پروژه ${fa(cur+1)}</b> · ${fa(cur+1)} از ${fa(N)}`;
  lbCard.style.transform = 'scale(1) rotateX(0deg) rotateY(0deg)';
  lbGlare.style.background = 'none';
}
function openLb(i){
  cur = i; lbOpen = true; showLb();
  lb.classList.add('open');
  requestAnimationFrame(() => { lbCard.style.transform = 'scale(1) rotateX(0) rotateY(0)'; });
  root.style.overflow = 'hidden';
}
function closeLb(){
  lbOpen = false; lb.classList.remove('open');
  lbCard.style.transform = 'scale(.92) rotateX(8deg)';
  root.style.overflow = '';
}
const step = d => { cur = (cur + d + N) % N; showLb(); };
world.addEventListener('click', e => {
  const fr = e.target.closest('.fr');
  if (fr) openLb(+fr.dataset.i);
});
document.getElementById('lbClose').addEventListener('click', closeLb);
document.getElementById('lbPrev').addEventListener('click', () => step(-1));
document.getElementById('lbNext').addEventListener('click', () => step(1));
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
addEventListener('keydown', e => {
  if (!lbOpen) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') step(1);
  if (e.key === 'ArrowRight') step(-1);
});
lbStage.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch' || reduce) return;
  const r = lbCard.getBoundingClientRect();
  const x = clamp((e.clientX - r.left) / r.width, 0, 1), y = clamp((e.clientY - r.top) / r.height, 0, 1);
  lbCard.style.transform = `scale(1) rotateX(${(.5 - y) * 14}deg) rotateY(${(x - .5) * 18}deg)`;
  lbGlare.style.background = `radial-gradient(circle at ${x*100}% ${y*100}%,rgba(255,255,255,.55),transparent 55%)`;
});
lbStage.addEventListener('pointerleave', () => {
  lbCard.style.transform = 'scale(1) rotateX(0deg) rotateY(0deg)';
  lbGlare.style.background = 'none';
});
let sx = 0;
lb.addEventListener('touchstart', e => { sx = e.changedTouches[0].clientX; }, { passive: true });
lb.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
}, { passive: true });

addEventListener('resize', metrics);
requestAnimationFrame(tick);
</script>
</body>
</html>
